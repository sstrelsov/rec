# mitmtool Configuration
# This file controls what traffic gets captured and displayed

[general]
# Output directory for captured data
output_dir = "output"
# Port for the documentation viewer
viewer_port = 8000

[filtering]
# HTTP methods to include in timeline (select multiple)
# Available: GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE, CONNECT
http_methods = ["GET", "POST", "PUT", "PATCH", "DELETE"]

# Request types to include
include_browser_requests = true    # User browsing, page navigation
include_api_requests = true        # API calls, JSON responses
include_unknown_requests = true    # Requests with unclear context - ENABLED to catch HTML pages

# Noise filtering - set to false to see everything
filter_static_assets = true       # .css, .js, .png, .jpg, etc.
filter_browser_housekeeping = true # favicon.ico, robots.txt, manifest.json
filter_health_checks = true       # /ping, /healthz, /status
filter_prefetch_requests = true   # Browser prefetch/preload optimizations

# Ads/Analytics blocked patterns - requests matching these patterns will be filtered out
blocked_patterns = [
    # Google Analytics & Ads
    "google-analytics.com", "googleanalytics.com", "google-analytics",
    "gtag", "gtm.js", "ga.js", "_ga", "googlesyndication.com",
    "doubleclick.net", "googleadservices.com",

    # Social Media Tracking
    "facebook.com/tr", "connect.facebook.net", "facebook.net",

    # Analytics Services
    "mixpanel.com", "amplitude.com", "segment.com", "segment.io",
    "hotjar.com", "fullstory.com", "logrocket.com", "datadog",

    # Common tracking paths
    "/pixel.gif", "/collect?", "/tr?", "/ads/", "/ad/", "/tracking",
    "/analytics", "/metrics", "/telemetry", "/beacon", "/ping"
]

[timeline]
# Timeline-specific settings
auto_refresh = false
default_items_per_page = 50
show_response_times = true
show_context_icons = true

[api_extractor]
# API documentation generation settings
enabled = true
min_calls_per_endpoint = 1
max_examples_per_endpoint = 3
include_request_headers = true
include_response_examples = true
